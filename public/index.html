<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>신뢰마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dceeb1'/><text y='.92em' x='50%25' text-anchor='middle' font-size='62'>🏘️</text></svg>">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/fonts/mono.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/student.css">
</head>
<body class="student">

  <!-- ============================================ 입장 -->
  <section data-screen="join" class="phone">
    <div class="join-hero">
      <p class="eyebrow">교실용 실시간 게임</p>
      <h1>신뢰마을</h1>
      <p class="t-body-lg">들키지 않으면, 괜찮을까?</p>
    </div>

    <div class="join-panel">
      <p class="caption" id="codeLabel">수업 코드 6자리</p>
      <input
        id="codeInput"
        class="code-input"
        type="text"
        inputmode="latin"
        autocomplete="off"
        autocapitalize="characters"
        autocorrect="off"
        spellcheck="false"
        maxlength="6"
        placeholder="ABC234"
        aria-labelledby="codeLabel"
        aria-describedby="joinHelp">
      <button class="btn btn-lg block-full" id="joinBtn" disabled>들어가기</button>
      <p class="t-body-sm join-help" id="joinHelp">칠판에 뜬 코드를 그대로 입력하세요.</p>
    </div>

    <div class="notice">
      <b>이름을 묻지 않아요.</b> 들어오면 동물 별명이 자동으로 생겨요.<br>
      로그인도, 앱 설치도 없어요.
    </div>
  </section>

  <!-- ============================================ 대기 -->
  <section data-screen="lobby" class="phone hidden">
    <div class="me-panel rise">
      <p class="caption">내 별명</p>
      <div class="me-nick"><span id="meEmoji">🦦</span> <span id="meNick">-</span></div>
      <p class="t-body-sm" style="opacity:.6">이 별명으로만 불려요. 진짜 이름은 아무도 몰라요.</p>
    </div>

    <div class="village-panel rise rise-1" id="villageCard">
      <p class="caption">우리 마을</p>
      <div class="village-name" id="villageName">-</div>
      <div class="village-meta">
        <span class="chip chip-on-block" id="villageSize">0명</span>
        <span class="chip chip-on-block">신뢰지수 <b id="villageTrust">60</b></span>
      </div>
    </div>

    <div class="waiting">
      <div class="dots"><span></span><span></span><span></span></div>
      <p class="t-body-lg" id="waitingText">선생님이 시작할 때까지 기다려 주세요</p>
      <p class="t-body-sm" style="opacity:.5" id="waitingSub">화면을 끄지 말고 그대로 두세요</p>
    </div>
  </section>

  <!-- ============================================ 진행 중 -->
  <section data-screen="stage" class="phone hidden">
    <header class="mini-bar">
      <div class="mini-row t-body-sm">
        <span class="mini-nick"><span id="barEmoji">🦦</span> <span id="barNick">-</span></span>
        <span class="mini-village" id="barVillage">-</span>
        <span class="mini-coin">🪙 <span id="barCoins">0</span></span>
      </div>
      <p class="caption mini-stage" id="barStage"></p>
    </header>
    <main id="stageArea" class="stage-main"></main>
  </section>

  <script type="module" src="/js/student/main.js"></script>
</body>
</html>
