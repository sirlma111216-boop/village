# Render 한 번에 배포하기 (https://render.com)
#
# New → Blueprint → 이 저장소를 고르면 끝입니다.
# 설정할 환경변수는 없습니다 — 진행자가 접속한 주소를 서버가 그대로 읽어 QR 을 만듭니다.

services:
  - type: web
    name: trust-village
    runtime: node
    plan: free                 # 수업·시연에 쓸 거라면 starter 로 올리세요 (잠들지 않음)
    region: singapore          # 한국에서 가장 가까운 리전
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
